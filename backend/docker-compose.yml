services:
  postgres:
    image: postgres:16-alpine
    container_name: omni-crm-postgres
    environment:
      POSTGRES_DB: arabic_omnichannel_crm
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omni-crm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
